name: Deploy ZYK to zykai.net

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public website repository
        uses: actions/checkout@v4

      - name: Prepare Pages artifact from public-only snapshot
        shell: bash
        run: |
          test -f public-site/index.html
          rm -rf site
          mkdir -p site
          cp -R public-site/. site/
          printf 'zykai.net\n' > site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
