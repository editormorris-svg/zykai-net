name: Deploy ZYK to zykai.net

on:
  push:
    branches: [main]
    paths:
      - 'public-site/**'
      - 'brand/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public website repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test identity and historical-account safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build public website and verified channel register
        run: python3 scripts/build_presence.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
